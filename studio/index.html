<!doctype html>
<html lang="de-CH">
<head><!--demo-weiche--><script src="/_demo/karte.js"></script><script src="/_demo/shim.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empfang · Familie Maeder</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b131f">
<link rel="icon" href="/assets/logo/familie-maeder.svg">
<link rel="preload" href="/assets/fonts/librecaslon-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="studio.css?v=1">
<script src="/besuch.js?v=3c4c57a56e" defer></script><script src="/verweil.js?v=5881fd455d" defer></script></head>
<body>
<style>.probehinweis{position:fixed;z-index:99;top:10px;left:calc(50% + 134px);transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:#b89850;color:#0f1620;font:500 11px/1.2 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 8px 18px -8px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 300px);overflow:hidden;text-overflow:ellipsis}@media(max-width:860px){.probehinweis{left:50%;top:auto;bottom:84px;max-width:calc(100vw - 24px)}}</style><div class="probehinweis">Probe-Fassung · Ihre Änderungen bleiben in diesem Browser</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="zeichen"></g></defs></svg>
<div id="tor" class="tor" hidden></div>
<div id="app" class="app" hidden>
  <aside class="rand" id="rand"></aside>
  <div class="haupt">
    <main class="flaeche" id="sicht" tabindex="-1"></main>
    <div class="leiste" id="leiste" aria-live="polite"></div>
  </div>
</div>
<div id="lade" class="lade" hidden></div>
<div id="vergleich" class="vgl" hidden></div>
<div id="fenster" class="fenster" hidden></div>
<div id="meldung" class="meldung" aria-live="polite"></div>
<input type="file" id="datei" accept="image/jpeg,image/png,image/webp" hidden>
<script>
(function(){function merk(t){try{var a=JSON.parse(localStorage.getItem('fm_fehler')||'[]');a.push({z:new Date().toISOString(),t:String(t).slice(0,300)});localStorage.setItem('fm_fehler',JSON.stringify(a.slice(-20)))}catch(e){}}
addEventListener('error',function(e){merk((e.filename||'').split('/').pop()+':'+(e.lineno||'')+' '+(e.message||'Fehler'))});
addEventListener('unhandledrejection',function(e){merk('Versprechen: '+((e.reason&&e.reason.message)||String(e.reason)))});
/* Notausgang: zeigt sich der Empfang nach zwölf Sekunden nicht, steht unten der Weg zur Prüfung, die auch ohne ihn läuft */
setTimeout(function(){var app=document.getElementById('app'),tor=document.getElementById('tor');if((!app||app.hidden)&&(!tor||tor.hidden)){
var d=document.createElement('div');d.id='notausgang';d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;display:flex;gap:14px;align-items:center;padding:12px 14px 12px 20px;border-radius:999px;background:#f2ece1;color:#0f1620;font:14px/1.3 system-ui,sans-serif;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)';
d.innerHTML='<span>Der Empfang braucht länger als sonst oder startet nicht.</span><a href="pruefung.html" style="font:500 10.5px/1 \'DM Mono\',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:#0b131f;color:#f2ece1;text-decoration:none">Zur Prüfung</a>';document.body.appendChild(d)}},12000);})();
</script>
<script src="studio.js?v=1"></script>
</body>
</html>
